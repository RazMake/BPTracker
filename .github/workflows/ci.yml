name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  COVERAGE_THRESHOLD: 85

jobs:
  build-and-test:
    name: Build, test and gate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - name: Install the Android workload
        # The solution includes the MAUI head, so a pull request that breaks the phone
        # app fails here rather than at release time.
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore BPTracker.slnx

      - name: Build (warnings are errors)
        run: dotnet build BPTracker.slnx -c Release --no-restore -warnaserror

      - name: Test with coverage
        run: >
          dotnet test BPTracker.slnx -c Release --no-build
          --collect "XPlat Code Coverage"
          --settings build/coverage.runsettings
          --results-directory artifacts/coverage

      - name: Enforce coverage floor
        # The double dash is required. With a single dash ReportGenerator ignores the
        # setting and the gate silently passes.
        run: >
          dotnet reportgenerator
          "-reports:artifacts/coverage/**/coverage.cobertura.xml"
          "-targetdir:artifacts/coveragereport"
          "-reporttypes:Html;MarkdownSummaryGithub;TextSummary"
          "--minimumCoverageThresholds:lineCoverage=${{ env.COVERAGE_THRESHOLD }}"

      - name: Publish coverage summary
        if: always()
        shell: pwsh
        run: |
          $summary = 'artifacts/coveragereport/SummaryGithub.md'
          if (Test-Path $summary) {
            Get-Content $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/coveragereport
          retention-days: 14
